# Тестовый потолок: пресет full и тестовые значения параметров безопасности (раздел 4.5 проекта).
# Путь задаёт maven-surefire-plugin (AWMS_FEATURES_FILE в BK/pom.xml), поэтому файл разработчика
# ./config/awms-features.properties тестам не виден. Тесты с другим профилем задают его своими свойствами
awms.features.preset=full
awms.features.ticket=Тестовый потолок
awms.features.admin.mode=disable-only
awms.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost
awms.network.outbound.allowed=localhost:8085
awms.video.retention-days=30
