spring.application.name=dinamika_back
ip_address=http://109.69.22.155

# Профиль функций установки (потолок): файл рядом с jar или по абсолютному пути из AWMS_FEATURES_FILE.
# Правит администратор сервера, применяется при перезапуске. Нет файла — пресет isolated (изолированный минимум).
# Ключи awms.features.* и параметры безопасности принимаются только из этого файла: окружение их не переопределяет
spring.config.import=optional:file:${AWMS_FEATURES_FILE:./config/awms-features.properties}

# База данных PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dinamika?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=postgres
spring.datasource.password=Tuduta95

# JPA настройки - ВРЕМЕННО create
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway настройки (явные)
spring.flyway.url=jdbc:postgresql://localhost:5432/dinamika
spring.flyway.user=postgres
spring.flyway.password=Tuduta95
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true

# Отключаем стандартную инициализацию
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Остальные настройки
server.port=8084
server.address=0.0.0.0
logging.level.com.example=DEBUG
logging.level.org.flywaydb=DEBUG

# Отключаем логирование SQL запросов Hibernate
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

jwt.cookie-token-key={"kty":"oct","kid":"d23af0bb-9ed5-4ae8-9026-82c206c9865b","k":"mVN0Rvq0jSGa09hhKGd4fQ","alg":"A128GCM"}
jwt.access-token-name=access-token
jwt.access-token-expiration-minutes=180
jwt.refresh-token-name=refresh-token
jwt.refresh-token-expiration-minutes=14400

file.upload-dir=uploads
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.enabled=true

sync.service.url=http://localhost:8085
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.web.resources.static-locations=file:uploads/
spring.mvc.static-path-pattern=/uploads/*

api.key.awms=awms-api-key-2026
# ==================== Видеоархив ====================
# Путь к ffmpeg.exe; ffprobe.exe ищется в той же папке (или задайте video.ffprobe-path в файле потолка)
video.ffmpeg-path=C:/ffmpeg/bin/ffmpeg.exe
# Каталог записей: относительный путь — от папки, из которой запущен сервер
video.storage-dir=video-archive
# Предел длительности одной записи, сек — страховка, если событие «окончание» не придёт
video.max-record-seconds=3600
# Сколько ждать ответа камеры, сек
video.connect-timeout-seconds=8
# Сколько отдавать один кадр живого просмотра, не обращаясь к камере заново, мс
video.snapshot-cache-ms=2000

# Интерактивная карта станций: картинки планов цехов (не в публичном uploads/)
station-plans.storage-dir=data/station-plans
# Чистка файлов-сирот планов при старте. Удаляет безвозвратно, поэтому true — только там, где каталог планов
# принадлежит одной базе (прод с абсолютным storage-dir); у стенда или теста с другой базой тот же каталог — false
station-plans.orphan-cleanup=false
# 3D-модели номенклатуры: исходники и GLB-копии для просмотра (не в публичном uploads/)
nomenclature.models-dir=data/nomenclature-models
