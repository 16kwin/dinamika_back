# Профиль функций AWMS «ДИНАМИКА» (потолок установки): пресет «Изолированный минимум» (isolated).
# Работает только ядро учёта: справочники, номенклатура со штрихкодами, QR, SKU и поставками, станции
# (плитка и список), пополнение, контроль остатков, вход и автоблокировка, страница «Безопасность».
# Выключено всё остальное: видео, карта и план цеха, 3D, ГПП, панели главной, заказы и ТКП, WebSocket,
# выгрузки, загрузка файлов, интеграции, анонимный доступ, PWA, черновики, заглушки.
# Этот же пресет действует, если файла потолка нет совсем.
#
# Как применить: скопировать в config/awms-features.properties рядом с jar (или по пути из AWMS_FEATURES_FILE)
# и перезапустить службу. На ходу файл не перечитывается, из интерфейса и API не меняется.
# Правила (подробно — deploy/INSTALL.md):
#  - только ключи awms.features.* и параметры безопасности; чужой ключ или опечатка — служба не запустится;
#  - эти ключи нельзя задавать переменными окружения, аргументами или -D — служба не запустится;
#  - значения — латиницей и цифрами (файл читается в ISO-8859-1), комментарии — как угодно;
#  - сохранять без BOM; владелец файла — администраторы ОС, учётная запись службы только читает.
# Полный список ключей — config/awms-features.properties.example.

awms.features.preset=isolated
# Основание: номер заявки или служебной записки ИБ, латиницей (например SZ-IB-2026-041 ot 14.10.2026)
awms.features.ticket=SZ-IB-NOMER-I-DATA

# Кому доступны функции, если ИБ разрешит их отдельной строкой (сейчас выключены пресетом)
awms.features.export.roles=ADMIN,DIRECTOR
awms.features.video.archive.roles=ADMIN,DIRECTOR

# Переключатели администратора (этап 2): выключают ADMIN и SECURITY, включает обратно только SECURITY
awms.features.admin.mode=disable-only

# Срок хранения видеозаписей, дней (1-3650). Действует и при выключенном видео: старые записи удаляются
awms.video.retention-days=30

# Слушать только нужный сетевой интерфейс (по умолчанию 0.0.0.0 - все). За nginx на этом же сервере - 127.0.0.1
#server.address=127.0.0.1
# ОБЯЗАТЕЛЬНО заменить на адрес сайта - точно как в адресной строке браузера (CORS; WebSocket берёт этот же
# список). За nginx по https (deploy/nginx) - https://<домен сайта>: служба видит запрос как http, и без
# этой строки вход отвечает 403 «Invalid CORS request». Несколько адресов - через запятую.
# Умолчание без строки - только http://localhost:3000,http://127.0.0.1:3000,http://localhost
awms.cors.allowed-origins=https://awms.zavod.local
