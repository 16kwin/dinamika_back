# Профиль функций AWMS «ДИНАМИКА» (потолок установки): пресет «Расширенный» (full) — стенд, демонстрации.
# Поведение как до внедрения выключателей: видео, карта и план цеха, 3D, ГПП, панели главной и граф закупок,
# заказы и ТКП, WebSocket, интеграции, анонимный режим табло, PWA, заглушки меню.
# Выключено и в этом пресете: тестовая синхронизация, унаследованная раздача /images/** и т. п., импорт
# migration_photos при старте, предложение браузеру сохранить пароль.
# Этот файл — профиль нашего стенда и dynamikaawms.ru. Заказчику в закрытом контуре — standard или isolated;
# full у заказчика — только по решению ИБ.
#
# Как применить: скопировать в config/awms-features.properties рядом с jar (или по пути из AWMS_FEATURES_FILE)
# и перезапустить службу. На ходу файл не перечитывается, из интерфейса и API не меняется.
# Правила (подробно — deploy/INSTALL.md):
#  - только ключи awms.features.* и параметры безопасности; чужой ключ или опечатка — служба не запустится;
#  - эти ключи нельзя задавать переменными окружения, аргументами или -D — служба не запустится;
#  - значения — латиницей и цифрами (файл читается в ISO-8859-1), комментарии — как угодно;
#  - сохранять без BOM; владелец файла — администраторы ОС, учётная запись службы только читает.
# Полный список ключей — config/awms-features.properties.example.

awms.features.preset=full
# Основание: номер заявки или служебной записки, латиницей
awms.features.ticket=STAND-full-2026-10-14

# Переключатели администратора (этап 2): выключают ADMIN и SECURITY, включает обратно только SECURITY
awms.features.admin.mode=disable-only

# Срок хранения видеозаписей, дней (1-3650). Действует и при выключенном видео: записи старше удаляются
awms.video.retention-days=30

# Исходящие HTTP (хост:порт через запятую): обмен заказами и ТКП с внешней системой по sync.service.url.
# Без этой строки исходящих запросов нет даже при включённых заказах
awms.network.outbound.allowed=localhost:8085

# Адреса, с которых браузер обращается к API (CORS): тот же список, что был зашит в SecurityConfig,
# плюс http://127.0.0.1 и http://109.69.22.155 (сайт на 80-м порту по IP). WebSocket берёт этот же список
awms.cors.allowed-origins=http://localhost,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:3000,http://109.69.22.155,http://109.69.22.155:3000,http://109.69.22.155:8084,http://dynamikaawms.ru,https://dynamikaawms.ru

# Роли на стенде не ограничены — как сейчас. У заказчика рекомендуется:
#awms.features.export.roles=ADMIN,DIRECTOR
#awms.features.video.archive.roles=ADMIN,DIRECTOR
